<section>
<h2>Day 1: Frame and baseline</h2>
<ol>
<li><p>The advisers can agree 800 support plans a year, starting in week 3 of a programme. Which framing fits?</p><ul><li><b>A.</b> One row per trainee: will this trainee ever leave a programme?</li><li><b>B.</b> One row per enrolment, at exit: did the trainee complete?</li><li><b>C.</b> One row per provider and year: how many trainees will leave?</li><li><b>D.</b> One row per enrolment, at the end of week 2: will the trainee not complete?</li></ul></li>
<li><p>Loay reports that his model reaches an average precision of 0.30 on a split of his own. What is the right reply?</p><ul><li><b>A.</b> It is poor: the model is wrong 70% of the time</li><li><b>B.</b> It cannot be judged until it stands beside the constant and the rules on the same folds</li><li><b>C.</b> It is good: it is well above the base rate of 0.12</li><li><b>D.</b> It is slightly worse than the rules, which score 0.31</li></ul></li>
<li><p>You score a logistic model on five folds. On which rows is the scaler of fold 3 fitted?</p><ul><li><b>A.</b> On the training rows of fold 3 only, each time the pipeline is fitted</li><li><b>B.</b> On all development rows, once, before the folds are made</li><li><b>C.</b> On the validation rows of fold 3, so that they are scaled correctly</li><li><b>D.</b> On the 2025 cohort, because it is the most recent</li></ul></li>
<li><p>Four candidate features for a row scored at the end of week 2. Which one fails the time-travel test?</p><ul><li><b>A.</b> The number of the trainee's enrolments that ended before the prediction date</li><li><b>B.</b> The trainee's entry test score</li><li><b>C.</b> The trainee's non-completion rate over all of their enrolments in the table</li><li><b>D.</b> The trainee's days absent in the first two weeks of this programme</li></ul></li>
<li><p>A hospital wants to phone patients who are likely to miss a follow-up visit. The phone team works two days before each visit. When is the prediction made?</p><ul><li><b>A.</b> When the patient is first registered</li><li><b>B.</b> On the morning of the visit</li><li><b>C.</b> Two days before the visit</li><li><b>D.</b> After the visit, when attendance is recorded</li></ul></li>
<li><p>Of 45,000 enrolments, 16.7% are not completed. A model scores trainees at the end of week 2; 2,444 trainees have left by then. Which base rate does the model have to beat?</p><ul><li><b>A.</b> 16.7%, the rate of all enrolments</li><li><b>B.</b> The rate among the trainees still enrolled at the end of week 2</li><li><b>C.</b> The rate among the 2,444 who left early</li><li><b>D.</b> 50%, because there are two classes</li></ul></li>
<li><p>A support plan costs SAR 450. A lost place costs SAR 9,000. One supported non-completer in four then completes. Above which probability of not completing does a plan pay for itself?</p><ul><li><b>A.</b> 0.05</li><li><b>B.</b> 0.20</li><li><b>C.</b> 0.25</li><li><b>D.</b> 0.50</li></ul></li>
<li><p>In a validation fold 11% of trainees do not complete. A predictor gives every trainee the same score. What is its average precision?</p><ul><li><b>A.</b> 0.00</li><li><b>B.</b> 0.89</li><li><b>C.</b> 0.50</li><li><b>D.</b> 0.11</li></ul></li>
<li><p>Model A scores 0.52 on five time-ordered folds. A colleague scores model B at 0.55 on five random folds of the same table. What can you say?</p><ul><li><b>A.</b> B is better by 0.03</li><li><b>B.</b> A is better, because time-ordered folds are harder</li><li><b>C.</b> Nothing yet: the two models were scored on different rows</li><li><b>D.</b> They are equal within the fold spread</li></ul></li>
<li><p>An analyst fills missing ages with the median of the whole table, then cross-validates a model. What kind of fault is this?</p><ul><li><b>A.</b> Target leakage: the median is computed from the outcome</li><li><b>B.</b> Preparation leakage: a statistic was fitted on rows that are later held out</li><li><b>C.</b> Group contamination: the same person is on both sides</li><li><b>D.</b> No fault: a median does not use the outcome</li></ul></li>
<li><p>A library network groups its 900 members with k-means (k = 3) on two columns: loans a year (5 to 819) and the share of loans that are e-books (0 to 0.93). The three segments have mean loans of 45, 132 and 322, and mean e-book shares of 0.38, 0.37 and 0.33. What do you conclude?</p><ul><li><b>A.</b> Members hardly differ in how much they read e-books</li><li><b>B.</b> Only loans shaped the segments: scale both columns and run again</li><li><b>C.</b> Three segments are too few: raise k until the e-book share differs</li><li><b>D.</b> The segments are sound: k-means made each one as tight as it could</li></ul></li>
<li><p>A row is scored on 20 April. The same trainee has an earlier enrolment that started in January and ended in September of the same year. May its outcome be used as a history feature for the April row?</p><ul><li><b>A.</b> Yes, it started earlier</li><li><b>B.</b> Yes, if the model is validated on time-ordered folds</li><li><b>C.</b> No, its outcome was not known on 20 April</li><li><b>D.</b> Only if the trainee completed it</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Trees and challengers</h2>
<ol>
<li><p>Two history features lifted the logistic rung from 0.501 to 0.524. The fold spread of that rung is 0.028. Why is the gain still believable?</p><ul><li><b>A.</b> Because 0.023 is large compared with the base rate of 0.12</li><li><b>B.</b> Because the table has 32,000 development rows</li><li><b>C.</b> Because the gain has the same sign on all five folds, where both models met the same rows</li><li><b>D.</b> Because the features passed the time-travel test</li></ul></li>
<li><p>A boosted model scores 0.85 on its 9,068 training rows and 0.50 on the validation rows of the same fold. What do you conclude?</p><ul><li><b>A.</b> The model has memorised part of the training rows; 0.50 is the number to log</li><li><b>B.</b> The true score is about halfway, near 0.67</li><li><b>C.</b> The validation rows must contain a leak</li><li><b>D.</b> The validation fold is unusually hard and should be replaced</li></ul></li>
<li><p>An analyst tries 200 settings, scores each on the same five folds and reports the highest mean, 0.547. What is wrong with the number?</p><ul><li><b>A.</b> 200 trials are too many for a table of this size</li><li><b>B.</b> Random search is unreliable; a grid would give the true score</li><li><b>C.</b> Five folds are too few to score any model</li><li><b>D.</b> The folds that chose the winner also score it, so part of 0.547 is luck</li></ul></li>
<li><p>A team reports that an automated tool beats their tuned model, 0.561 to 0.529. Which detail makes the comparison worthless?</p><ul><li><b>A.</b> The tool blends several models and the champion is one model</li><li><b>B.</b> The tool's 0.561 is its own internal validation score; the champion's 0.529 is on the fund's folds</li><li><b>C.</b> The tool was told to optimise average precision</li><li><b>D.</b> Both ran with a limit of 28 seconds a fold</li></ul></li>
<li><p>A challenger's mean paired difference is +0.006, with a 95% interval from −0.004 to +0.016. The minimum effect stated in advance is +0.01. What is the decision?</p><ul><li><b>A.</b> Adopt the challenger: its mean difference is positive</li><li><b>B.</b> The two models are shown to be equal</li><li><b>C.</b> Not shown: the interval straddles the minimum effect, so the champion stays</li><li><b>D.</b> Adopt it, with the minimum effect lowered to +0.005</li></ul></li>
<li><p>A boosted model scores 0.90 on its training rows and 0.48 on the validation rows of the same fold. A logistic model scores 0.52 and 0.50. Which model goes further up the ladder?</p><ul><li><b>A.</b> The boosted model: its training score shows what it can reach</li><li><b>B.</b> The boosted model, after averaging its two scores</li><li><b>C.</b> Neither: the gap of the boosted model proves a leak</li><li><b>D.</b> The logistic model: only validation scores are compared</li></ul></li>
<li><p>A team wants to tune a boosted model on a table of 30,000 rows. Which plan keeps the reported score honest?</p><ul><li><b>A.</b> Try settings until the validation score stops improving, then report it</li><li><b>B.</b> Tune on the test set, since it is the most recent data</li><li><b>C.</b> Run a full grid of 2,000 settings and report the best mean over the folds</li><li><b>D.</b> Fix 20 random trials in advance, choose on inner folds, report on the outer folds</li></ul></li>
<li><p>A nested search picks different settings in each of five outer folds and reports a mean of 0.53. What does 0.53 describe?</p><ul><li><b>A.</b> The settings that were chosen most often</li><li><b>B.</b> Nothing usable, because the settings disagree</li><li><b>C.</b> The best of the five sets of settings</li><li><b>D.</b> The procedure: search under this budget, then fit</li></ul></li>
<li><p>A colleague proposes a pretrained tabular model, called through its vendor's hosted service, as a challenger for a model on patient records. What do you settle before any score is computed?</p><ul><li><b>A.</b> Whether its published benchmark results are better than yours</li><li><b>B.</b> Whether it runs faster than your tuned model</li><li><b>C.</b> Whether it supports the same number of features</li><li><b>D.</b> Whether the licence allows this use and whether the records may leave your machines</li></ul></li>
<li><p>An automated tool is given two hours and reports 0.58 from its own internal validation. Your tuned model took three minutes and scores 0.53 on your five time-ordered folds. What does the comparison show?</p><ul><li><b>A.</b> The tool is better by 0.05</li><li><b>B.</b> Your model is better, because it is faster</li><li><b>C.</b> Nothing: different rows, different budgets</li><li><b>D.</b> The tool overfits, because its score is higher</li></ul></li>
<li><p>Two models are scored on the same five folds. Model A: mean 0.530, fold spread 0.020. Model B: mean 0.540, fold spread 0.021. B is ahead on all five folds, by 0.008 to 0.012. What do you conclude?</p><ul><li><b>A.</b> B is ahead: the five paired differences are all positive and close together</li><li><b>B.</b> No difference: 0.010 is inside both spreads</li><li><b>C.</b> A is better: its spread is smaller</li><li><b>D.</b> Nothing can be said with five folds</li></ul></li>
<li><p>A challenger's mean paired difference is +0.021 with a 95% interval from +0.013 to +0.029. The minimum effect stated in advance is +0.01. What is the decision?</p><ul><li><b>A.</b> Not shown: keep the champion</li><li><b>B.</b> Keep the champion</li><li><b>C.</b> Adopt the challenger</li><li><b>D.</b> Lower the minimum effect and test again</li></ul></li>
<li><p>Why is the minimum effect for adopting a challenger written down before the contest is run?</p><ul><li><b>A.</b> So that the bar cannot drift to just below whatever was measured</li><li><b>B.</b> So that the interval becomes narrower</li><li><b>C.</b> Because the t distribution requires it</li><li><b>D.</b> So that fewer folds are needed</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Validation and leakage</h2>
<ol>
<li><p>The challenger differed from the champion by −0.007 (95% interval −0.018 to +0.004). The minimum effect was +0.01. Why was the decision "keep the champion" and not "not shown"?</p><ul><li><b>A.</b> Because the mean difference is negative</li><li><b>B.</b> Because the whole interval lies below the minimum effect</li><li><b>C.</b> Because the interval excludes zero</li><li><b>D.</b> Because the champion won on three of the five folds</li></ul></li>
<li><p>The fund wants to offer Mubakkir to a partner fund in another country. None of its trainees has ever enrolled with Sullam. Which score from Lab 3.1 comes closest to what the partner should expect?</p><ul><li><b>A.</b> The time-ordered score, 0.525</li><li><b>B.</b> The random score, 0.521</li><li><b>C.</b> The grouped score with history hidden, 0.500, and even that with caution</li><li><b>D.</b> The score of returning trainees, 0.578</li></ul></li>
<li><p>A bank predicts which customers will close their account next month. One feature is the number of calls the customer made to the retention desk. Customers are transferred to that desk when they ask to close the account. Which kind of leak is this?</p><ul><li><b>A.</b> Target leakage</li><li><b>B.</b> Preparation leakage</li><li><b>C.</b> Group contamination</li><li><b>D.</b> No leak: call behaviour is a legitimate feature</li></ul></li>
<li><p>A received table scores far above your ladder. Its data dictionary lists when every recorded column is written. Twelve further columns were computed by a colleague. Where do you start?</p><ul><li><b>A.</b> Tune the model again on the received table</li><li><b>B.</b> Drop all twelve computed columns</li><li><b>C.</b> Switch to a time-ordered split and compare</li><li><b>D.</b> Read the dictionary for columns recorded after the prediction time, then rank the rest by importance</li></ul></li>
<li><p>A vendor's slide says: "Our model predicts non-completion with 91% accuracy." Which question tells you most, fastest?</p><ul><li><b>A.</b> Which algorithm does the model use?</li><li><b>B.</b> How many rows was it trained on?</li><li><b>C.</b> What share of the test rows completed, and what does "everyone completes" score on them?</li><li><b>D.</b> What is its area under the curve?</li></ul></li>
<li><p>A model predicts equipment failure from daily readings of 50 machines, a year of rows per machine. It will be installed on 30 machines that are delivered next month. Which validation split rehearses that use?</p><ul><li><b>A.</b> A grouped split: all rows of a machine on one side</li><li><b>B.</b> A random split of the daily rows</li><li><b>C.</b> A time-ordered split of all machines together</li><li><b>D.</b> A random split, stratified by failure</li></ul></li>
<li><p>Loans are repaid over twelve months, and default is recorded when it happens. On 1 July a team trains on "all loans with a known outcome". Which loans from the last twelve months are in the training rows?</p><ul><li><b>A.</b> All of them</li><li><b>B.</b> None of them</li><li><b>C.</b> Only those that have already defaulted</li><li><b>D.</b> A random sample of them</li></ul></li>
<li><p>On one table a model scores 0.52 under a random split and 0.53 under time-ordered folds, with fold spreads of 0.02. What do you write in the validation section?</p><ul><li><b>A.</b> The random split overstates performance, as it always does</li><li><b>B.</b> The time-ordered folds are faulty: they should score lower</li><li><b>C.</b> Both were measured; no gap is shown for this model; the time-ordered folds are kept because they rehearse the use</li><li><b>D.</b> The splits are interchangeable from now on</li></ul></li>
<li><p>Why can a random split not show how much a model loses when it is used a year after training?</p><ul><li><b>A.</b> Because it trains and validates on rows from the same period</li><li><b>B.</b> Because random folds are smaller</li><li><b>C.</b> Because it does not stratify by year</li><li><b>D.</b> Because it uses fewer trees</li></ul></li>
<li><p>A churn model uses each customer's past complaints as features. Time-ordered folds give 0.55. The company wants to use it in a new country where no customer has any past. Which estimate is the most relevant?</p><ul><li><b>A.</b> 0.55, the time-ordered score</li><li><b>B.</b> The score with history features hidden for the validation rows</li><li><b>C.</b> The score of the customers with the longest history</li><li><b>D.</b> The training score</li></ul></li>
<li><p>A model predicts which insurance claims are fraudulent when they are filed. One feature is "assigned to the special investigations unit". Claims are sent to that unit when a handler suspects fraud. What is this?</p><ul><li><b>A.</b> A legitimate feature</li><li><b>B.</b> Preparation leakage</li><li><b>C.</b> Group contamination</li><li><b>D.</b> Target leakage</li></ul></li>
<li><p>A model scores each order for the risk of a return on the day it ships. One feature is the customer's return rate, computed over all of the customer's orders in the table. What is the fault?</p><ul><li><b>A.</b> Preparation leakage: the rate should be scaled inside the pipeline</li><li><b>B.</b> None: the rate describes the customer</li><li><b>C.</b> Group contamination: customers repeat</li><li><b>D.</b> Future information: the rate includes later orders and this one</li></ul></li>
<li><p>A table has one row per student, measured in one term. A model will be used on next term's students of the same schools; teaching and grading rules change little. Before cross-validation, the analyst kept the 15 of 400 columns most correlated with the outcome, using all rows. Which pair is right?</p><ul><li><b>A.</b> Target leakage; a time-ordered split</li><li><b>B.</b> Preparation leakage; a random split with the selection inside each fold</li><li><b>C.</b> No leak; a random split</li><li><b>D.</b> Group contamination; a grouped split by student</li></ul></li>
<li><p>A received table has unique record keys. You suspect that some records were entered twice when two systems were merged. How do you check?</p><ul><li><b>A.</b> Count duplicated keys</li><li><b>B.</b> Look for rows that agree on the columns describing the real event</li><li><b>C.</b> Sort by importance and inspect the top feature</li><li><b>D.</b> Switch to a time-ordered split</li></ul></li>
<li><p>During an audit a team removes five suspicious columns at once, and the score falls from 0.95 to 0.55. What is lost by doing it this way?</p><ul><li><b>A.</b> Which columns were leaks, how much each mattered, and whether an honest one was thrown out</li><li><b>B.</b> Nothing: the final score is what matters</li><li><b>C.</b> The reproducibility of the run</li><li><b>D.</b> The calibration of the model</li></ul></li>
<li><p>A notebook reports 94% accuracy for predicting a fault that occurs in 5% of units. What do you ask first?</p><ul><li><b>A.</b> What a constant answer scores on the same test rows, and what share of them had the fault</li><li><b>B.</b> Which library was used</li><li><b>C.</b> Whether the learning rate was tuned</li><li><b>D.</b> How long training took</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Errors, groups and documentation</h2>
<ol>
<li><p>In the received table, trainee_noncompletions equalled the past-only count on 84% of the rows and carried 80% of the model's gain. Which kind of leak is it?</p><ul><li><b>A.</b> Group or duplicate contamination</li><li><b>B.</b> Preparation leakage</li><li><b>C.</b> No leak: a history of non-completion is a fair feature</li><li><b>D.</b> Future information</li></ul></li>
<li><p>The fund keeps the threshold of 0.41. Next year a new programme doubles the intake, with trainees much like this year's. What happens?</p><ul><li><b>A.</b> The list roughly doubles to 1,600 names, twice what the advisers can support</li><li><b>B.</b> The list stays at 800, because the threshold was chosen for 800</li><li><b>C.</b> Precision halves, because there are twice as many trainees</li><li><b>D.</b> The scores fall, so fewer trainees pass the threshold</li></ul></li>
<li><p>Two models have the same average precision. Model A's scores average 0.14, model B's 0.40; 13.5% of the cohort left. The fund wants to list everyone above the break-even probability, 0.20. Which statement holds?</p><ul><li><b>A.</b> Either model can be used: they rank equally well</li><li><b>B.</b> Only model A's scores can be compared with 0.20, after checking them by decile</li><li><b>C.</b> Model B is better: it is more confident about the trainees at risk</li><li><b>D.</b> Use the mean of the two scores</li></ul></li>
<li><p>In one region 12 trainees left and 9 of them were not on the list: a miss rate of 0.75, interval 0.47 to 0.91. The cohort's rate is 0.62. What do you report?</p><ul><li><b>A.</b> The model fails this region: 0.75 is far above 0.62</li><li><b>B.</b> The region is fine: its interval contains 0.62</li><li><b>C.</b> Leave the region out of the table: the slice is too small</li><li><b>D.</b> The rate with its interval, and that 12 cases cannot tell; pool with later cohorts</li></ul></li>
<li><p>You may add one sentence to the limits of Mubakkir's card. Which one helps its readers most?</p><ul><li><b>A.</b> "The model uses gradient-boosted trees with 400 trees of 8 leaves."</li><li><b>B.</b> "Results may vary on new data."</li><li><b>C.</b> "Not validated for trainees in their first two weeks: they have no early-absence record."</li><li><b>D.</b> "The model achieves an average precision of 0.55 on held-out data."</li></ul></li>
<li><p>A team of nurses can make 300 follow-up calls a month. A model scores 4,000 patients a month for the risk of readmission, which happens to 8% of them. Where does the threshold come from?</p><ul><li><b>A.</b> 0.5, the default of the library</li><li><b>B.</b> 0.08, the base rate</li><li><b>C.</b> The score of the 300th highest-ranked patient</li><li><b>D.</b> The score that maximises accuracy</li></ul></li>
<li><p>A list of 500 names has precision 0.60 and recall 0.35. Which sentence is right?</p><ul><li><b>A.</b> 60% of the people at risk are on the list</li><li><b>B.</b> The model is right 60% of the time</li><li><b>C.</b> 35% of the list had the outcome</li><li><b>D.</b> Of the people who went on to have the outcome, about a third were on the list</li></ul></li>
<li><p>A model trained with class weights ranks as well as an unweighted one. Its scores average 0.38 where 12% have the outcome. For which use is it unfit as it is?</p><ul><li><b>A.</b> Listing the 500 highest-ranked people</li><li><b>B.</b> Comparing average precision between the two models</li><li><b>C.</b> Listing everyone whose probability exceeds a break-even of 0.25</li><li><b>D.</b> Sorting people for a first review</li></ul></li>
<li><p>On which rows should a calibrator be fitted?</p><ul><li><b>A.</b> The training rows of the model, which are the most numerous</li><li><b>B.</b> The final test rows, which are the most recent</li><li><b>C.</b> Rows the model was not trained on, kept apart from the final test rows</li><li><b>D.</b> Any rows, since a calibrator has only two parameters</li></ul></li>
<li><p>Among people who had the outcome, the model missed 9 of 12 in district A (75%) and 300 of 500 in district B (60%). The overall miss rate is 61%. What can you say about district A?</p><ul><li><b>A.</b> The model is unfair to district A</li><li><b>B.</b> District A should be dropped from the report</li><li><b>C.</b> District A is fine, because its interval contains 61%</li><li><b>D.</b> With 12 cases the interval is wide and contains 61%: too few to tell</li></ul></li>
<li><p>A model that predicts missed medical appointments uses the number of earlier reminders sent to each patient. In rural clinics reminders are made by phone and are often not logged. Rural patients who miss appointments are flagged less often. Which bias type of the SDAIA AI Bias Reference Guide fits?</p><ul><li><b>A.</b> Measurement bias</li><li><b>B.</b> Coverage bias</li><li><b>C.</b> Sample size bias</li><li><b>D.</b> Aggregation bias</li></ul></li>
<li><p>A team deletes the gender column from its table "so that the model cannot discriminate". What is the consequence?</p><ul><li><b>A.</b> The model's errors are now equal for women and men</li><li><b>B.</b> Nothing changes, because gender was not predictive</li><li><b>C.</b> The model becomes less accurate for everyone</li><li><b>D.</b> Errors can still differ by gender, and the team can no longer measure whether they do</li></ul></li>
<li><p>Which sentence is the most useful limit in a model card?</p><ul><li><b>A.</b> "At sites that opened after training, probabilities ran four points low: use the rank there, not the number."</li><li><b>B.</b> "The model may not generalise to all settings."</li><li><b>C.</b> "The model was trained with gradient-boosted trees."</li><li><b>D.</b> "The model reaches an average precision of 0.55."</li></ul></li>
<li><p>A model ranks benefit applicants by the risk of an incomplete file, so that case workers can call them first. Which statement belongs in the card under "the human decision"?</p><ul><li><b>A.</b> "Applicants above 0.7 are rejected automatically."</li><li><b>B.</b> "The model is 91% accurate."</li><li><b>C.</b> "The score orders a case worker's call list; it never decides eligibility, and a case worker may call anyone."</li><li><b>D.</b> "Case workers must follow the ranking."</li></ul></li>
</ol>
</section>
