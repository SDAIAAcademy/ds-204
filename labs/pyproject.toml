[project]
name = "ds-204-labs"
version = "2027.1.0"
description = "Lab notebooks for the SDAIA Academy course Machine Learning for Tabular Data: Baselines and Validation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
    "autogluon.tabular[lightgbm]>=1.4",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "jupyterlab>=4.4",
]

[tool.uv]
package = false
